name: Build & Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Validate version and run tests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          python3 - <<'PYTHON'
          import os,re,pathlib
          text=pathlib.Path('app/build.gradle.kts').read_text()
          version=re.search(r'versionName = "([^"]+)"',text).group(1)
          if os.environ['IS_TAG']=='true':
              assert os.environ['RELEASE_TAG']=='v'+version, 'Tag and APK version differ'
          PYTHON
          ./gradlew testDebugUnitTest lintDebug --no-daemon --dependency-verification strict
  sign:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build and verify signed release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p app/keystore
          trap 'rm -f app/keystore/release.keystore' EXIT
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          ./gradlew assembleRelease --no-daemon --dependency-verification strict
          signer_path="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          aapt_path="$(dirname "$signer_path")/aapt"
          "$signer_path" verify --verbose app/build/outputs/apk/release/gasolineras.apk
          "$aapt_path" dump badging app/build/outputs/apk/release/gasolineras.apk > /tmp/gass-badging.txt
          python3 - <<'PYTHON'
          import os,pathlib,re
          data=pathlib.Path('/tmp/gass-badging.txt').read_text()
          assert "application-debuggable" not in data, 'Debuggable release'
          version=re.search(r"versionName='([^']+)'",data).group(1)
          assert os.environ['RELEASE_TAG']=='v'+version, 'Binary/tag mismatch'
          expected_code=re.search(r'versionCode = (\d+)',pathlib.Path('app/build.gradle.kts').read_text()).group(1)
          assert re.search(r"versionCode='([^']+)'",data).group(1)==expected_code, 'Binary code mismatch'
          PYTHON
          cd app/build/outputs/apk/release
          sha256sum gasolineras.apk > gasolineras.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-apk
          retention-days: 7
          if-no-files-found: error
          path: app/build/outputs/apk/release/gasolineras.apk*
  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-apk
          path: release-assets
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: "Gass ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            release-assets/gasolineras.apk
            release-assets/gasolineras.apk.sha256
