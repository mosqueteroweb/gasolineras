name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select empty Gradle home
        run: |
          test ! -e "$RUNNER_TEMP/gass-gradle-clean"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gass-gradle-clean" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '17'
          distribution: temurin
      - name: Test release guards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Require successful main preflight for this exact commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release_preflight.py --sha "$GITHUB_SHA" --timeout 0
      - name: Clean Linux dependency verification and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          python3 - <<'PYTHON'
          import os,re,pathlib
          text=pathlib.Path('app/build.gradle.kts').read_text()
          version=re.search(r'versionName = "([^"]+)"',text).group(1)
          if os.environ['IS_TAG']=='true':
              assert os.environ['RELEASE_TAG']=='v'+version, 'Tag and APK version differ'
          PYTHON
          test ! -e "$GRADLE_USER_HOME/caches"
          test ! -e .gradle
          test ! -e app/build
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --no-build-cache --no-configuration-cache --refresh-dependencies --dependency-verification strict
          git diff --exit-code -- gradle/verification-metadata.xml
      - name: Retain dependency verification diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preflight-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/reports/dependency-verification/
            app/build/reports/dependency-verification/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
  sign:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select empty signing Gradle home
        run: |
          test ! -e "$RUNNER_TEMP/gass-gradle-sign-clean"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gass-gradle-sign-clean" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '17'
          distribution: temurin
      - name: Build and verify signed release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p app/keystore
          trap 'rm -f app/keystore/release.keystore' EXIT
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          test ! -e "$GRADLE_USER_HOME/caches"
          test ! -e .gradle
          test ! -e app/build
          ./gradlew assembleRelease --no-daemon --no-build-cache --no-configuration-cache --refresh-dependencies --dependency-verification strict
          git diff --exit-code -- gradle/verification-metadata.xml
          signer_path="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          aapt_path="$(dirname "$signer_path")/aapt"
          "$signer_path" verify --verbose app/build/outputs/apk/release/gasolineras.apk
          "$aapt_path" dump badging app/build/outputs/apk/release/gasolineras.apk > /tmp/gass-badging.txt
          python3 - <<'PYTHON'
          import os,pathlib,re
          data=pathlib.Path('/tmp/gass-badging.txt').read_text()
          assert "application-debuggable" not in data, 'Debuggable release'
          version=re.search(r"versionName='([^']+)'",data).group(1)
          assert os.environ['RELEASE_TAG']=='v'+version, 'Binary/tag mismatch'
          expected_code=re.search(r'versionCode = (\d+)',pathlib.Path('app/build.gradle.kts').read_text()).group(1)
          assert re.search(r"versionCode='([^']+)'",data).group(1)==expected_code, 'Binary code mismatch'
          PYTHON
          cd app/build/outputs/apk/release
          sha256sum gasolineras.apk > gasolineras.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-apk
          retention-days: 7
          if-no-files-found: error
          path: app/build/outputs/apk/release/gasolineras.apk*
  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-apk
          path: release-assets
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: "Gass ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            release-assets/gasolineras.apk
            release-assets/gasolineras.apk.sha256
